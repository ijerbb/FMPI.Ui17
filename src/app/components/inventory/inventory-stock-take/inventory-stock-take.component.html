<div class="detail-page-background">
  <div class="main-header">
      <h2>{{ headerText }}</h2>
      <button class="btn btn-primary" (click)="addNew()">
        <i class="bi bi-plus-lg"></i> New Session
      </button>
  </div>

  <div class="form-group row">
  <div class="col-sm-12 search-header">
    <div class="card">
      <div class="card-header">
        <div class="row">
          <div class="col-md-12">
            <label><b>Search Criteria</b></label>
          </div>
        </div>
        <div class="row mt-2">
          <div class="col-md-12">
            <div class="input-group">
              <input type="search" 
                     class="form-control" 
                     placeholder="Search by session name..."
                     [(ngModel)]="searchStr"
                     (ngModelChange)="onSearch()">
              <button class="btn btn-secondary" type="button" (click)="onClearSearch()">
                <i class="bi bi-x-circle"></i> Clear
              </button>
              <button class="btn btn-secondary" type="button" (click)="loadList()">
                <i class="bi bi-arrow-repeat"></i> Refresh
              </button>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Action Bar: Above Table, Below Search -->
      <div class="action-bar">
        <div class="row align-items-center">
          <div class="col-md-12">
            <!-- Show only when items selected: Bulk Actions + Selection count + Clear -->
            <span *ngIf="selectedItems.size > 0" class="selection-info">
              <div class="btn-group me-2" role="group">
                <div class="dropdown">
                  <button class="btn btn-primary dropdown-toggle" type="button"
                          (click)="toggleBulkActionDropdown()"
                          data-bs-toggle="dropdown"
                          aria-expanded="false">
                    <i class="bi bi-gear-fill"></i> Bulk Actions
                  </button>
                  <ul class="dropdown-menu" [class.show]="showBulkActionDropdown">
                    <li *ngFor="let action of bulkActions">
                      <a class="dropdown-item" href="#" (click)="onBulkAction(action.action)">
                        <i class="bi bi-trash"></i> {{ action.label }}
                      </a>
                    </li>
                  </ul>
                </div>
              </div>
              <span class="selected-count fw-bold text-success">
                <i class="bi bi-check-circle-fill"></i> {{ selectedItems.size }} selected
              </span>
              <button class="btn btn-link text-secondary ms-2" (click)="selectedItems.clear(); updateSelectAll();">
                <i class="bi bi-x-circle"></i> Clear selection
              </button>
            </span>
          </div>
        </div>
      </div>
      
      <div class="card-body">
        <!-- Loading State -->
        <div *ngIf="loading" class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-2 text-muted">Loading sessions...</p>
        </div>

        <!-- Data Table -->
        <div class="table-responsive" *ngIf="!loading && filteredSessions.length > 0">
          <table class="table table-striped table-hover">
            <thead>
              <tr class="table-primary">
                <th style="width: 40px;">
                  <input type="checkbox" 
                         class="form-check-input"
                         [checked]="selectAll" 
                         (change)="toggleSelectAll()">
                </th>
                <th>Date</th>
                <th>Name</th>
                <th>Type</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let session of filteredSessions">
                <td>
                  <input type="checkbox" 
                         class="form-check-input"
                         [checked]="session.id !== undefined && session.id !== null && selectedItems.has(session.id)" 
                         (change)="toggleSelection(session.id)">
                </td>
                <td>{{ session.createdDate }}</td>
                <td>
                  <a routerLink="/inventorystocktakedetails/{{session.id}}" 
                     class="text-primary fw-bold"
                     style="cursor: pointer; text-decoration: none;">
                    {{ session.name }}
                  </a>
                </td>
                <td>{{ getTypeName(session.type) }}</td>
                <td>{{ getStatusName(session.status) }}</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- No Data State -->
        <div *ngIf="!loading && filteredSessions.length === 0" class="text-center py-5">
          <i class="bi bi-inbox display-4 text-muted"></i>
          <h5 class="mt-3 text-muted">No sessions found</h5>
          <p class="text-muted">Click "New Session" to create one.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Pagination -->
<app-pagination
  [pageNum]="sessions.pageNum"
  [pageSize]="10"
  [totalRecords]="sessions.totalRecords"
  (pageChange)="clickPageTasks($event)">
</app-pagination>

</div>
