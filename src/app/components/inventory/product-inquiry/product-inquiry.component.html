<div class="detail-page-background">
  <div class="main-header">
      <h5>
        <a routerLink="/product/PI">Products Inquiry</a>
        <i class="bi bi-chevron-right"></i>
        <span>Details</span>
        <span *ngIf="partNo"> of {{ partNo }}</span>
      </h5>
  </div>

  <div class="card">
    <div class="card-body">
      <form>
        <!-- Main Information Section - 2 Column Layout -->
        <div class="row g-3 mb-4">
          <!-- Left Column -->
          <div class="col-md-6">
            <div class="row mb-3">
              <label class="col-sm-4 col-form-label">Part No</label>
              <div class="col-sm-8">
                <input type="text" class="form-control" [(ngModel)]="partNo" name="partNo" readonly>
              </div>
            </div>
            <div class="row mb-3">
              <label class="col-sm-4 col-form-label">C Description</label>
              <div class="col-sm-8">
                <input type="text" class="form-control" [(ngModel)]="cDesc" name="cDescription" readonly>
              </div>
            </div>
            <div class="row mb-3">
              <label class="col-sm-4 col-form-label">Brand</label>
              <div class="col-sm-8">
                <input type="text" class="form-control" [(ngModel)]="brand" name="brand" readonly>
              </div>
            </div>
            <div class="row mb-3">
              <label class="col-sm-4 col-form-label">C Code</label>
              <div class="col-sm-8">
                <input type="text" class="form-control" [(ngModel)]="cCode" name="cCode" readonly>
              </div>
            </div>
            <div class="row mb-3">
              <label class="col-sm-4 col-form-label">Application</label>
              <div class="col-sm-8">
                <input type="text" class="form-control" [(ngModel)]="application" name="application" readonly>
              </div>
            </div>
          </div>

          <!-- Right Column -->
          <div class="col-md-6">
            <div class="row mb-3">
              <label class="col-sm-4 col-form-label">Main Group</label>
              <div class="col-sm-8">
                <input type="text" class="form-control" [(ngModel)]="mainGroup" name="mainGroup" readonly>
              </div>
            </div>
            <div class="row mb-3">
              <label class="col-sm-4 col-form-label">A Ref</label>
              <div class="col-sm-8">
                <input type="text" class="form-control" [(ngModel)]="aRef" name="aRef" readonly>
              </div>
            </div>
            <div class="row mb-3">
              <label class="col-sm-4 col-form-label">Cost Code</label>
              <div class="col-sm-8">
                <input type="text" class="form-control" [(ngModel)]="costCode" name="costCode" readonly>
              </div>
            </div>
            <div class="row mb-3">
              <label class="col-sm-4 col-form-label">Price</label>
              <div class="col-sm-8">
                <input type="text" class="form-control text-end" [(ngModel)]="price" name="price" readonly>
              </div>
            </div>
            <div class="row mb-3">
              <label class="col-sm-4 col-form-label">Effective Date</label>
              <div class="col-sm-8">
                <input type="text" class="form-control text-end" [(ngModel)]="effectiveDate" name="effectiveDate" readonly>
              </div>
            </div>
            <div class="row mb-3">
              <label class="col-sm-4 col-form-label">Qty On Hand</label>
              <div class="col-sm-8">
                <input type="text" class="form-control text-end" [(ngModel)]="qtyOnHand" name="qtyOnHand" readonly>
              </div>
            </div>
          </div>
        </div>

        <!-- Transaction History Section -->
        <div class="mb-4" *ngIf="productInquiries && productInquiries.length > 0">
          <div class="table-responsive">
            <table class="table table-hover">
              <thead>
                <tr class="table-primary">
                  <th>Module Type</th>
                  <th>Date</th>
                  <th>Trans Num</th>
                  <th>Name</th>
                  <th style="text-align:right">In</th>
                  <th style="text-align:right">Out</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let prodInq of productInquiries">
                  <td>{{ prodInq.moduleTypeName || prodInq.moduleType }}</td>
                  <td>{{ prodInq.transDate | date:'MM/dd/yyyy'}}</td>
                  <td>{{ prodInq.transNum }}</td>
                  <td>{{ prodInq.transName }}</td>
                  <td style="text-align:right">{{ prodInq.qtyIn }}</td>
                  <td style="text-align:right">{{ prodInq.qtyOut }}</td>
                </tr>
              </tbody>
            </table>
          </div>
          
          <!-- Pagination Component -->
          <app-pagination
            [pageNum]="pageNum"
            [pageSize]="20"
            [totalRecords]="totalRecords"
            (pageChange)="onPageChange($event)">
          </app-pagination>
        </div>
        
        <div class="mb-4" *ngIf="isScanSuccess && productInquiries.length == 0">
          <div class="ms-auto" style="text-align: center;">
            <label class="text-muted">No transaction history found</label>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
  
  <!-- Modal -->
  <div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="exampleModalLabel">Scanner</h5>
            <button id="modalClose" type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
              <!-- <zxing-scanner [formats]="allowedFormats" (scanSuccess)="onCodeResult($event)"></zxing-scanner> -->
          </div>
          <div class="modal-footer">
          </div>
        </div>
      </div>
    </div>
