<div class="detail-page-background">
  <div class="main-header">
      <h5>{{headerText}}</h5>
  </div>
  <div class="form-group row">
    <div class="col-sm-12 search-header">
      <div class="card">
        <div class="card-header">
          <div class="row">
            <label><b>Search Criteria</b></label>
          </div>
          <div class="input-group mb-3">
            <div class="input-group-prepend position-relative">
              <select class="form-control" [(ngModel)]="productSearch.searchMode" name="searchMode" style="max-width: 150px; padding-right: 30px;" [disabled]="isSearching">
                <option value="barcode">Barcode</option>
                <option value="advance">Advance Search</option>
              </select>
              <i class="bi bi-chevron-down position-absolute" style="right: 10px; top: 50%; transform: translateY(-50%); font-size: 0.75rem; color: #6c757d; pointer-events: none;"></i>
            </div>
            <div class="position-relative flex-grow-1">
              <input type="search" class="form-control pe-5" [(ngModel)]="productSearch.barcode" name="barcode" [placeholder]="productSearch.searchMode === 'barcode' ? 'Search barcode' : 'Search Part No, C Description, Brand, CCode, Application, Main Group, ARef'" aria-label="Search" aria-describedby="basic-addon2" (keyup.enter)="productSearch.searchMode === 'advance' ? searchBarcode() : null" [disabled]="isSearching">
              <button class="btn btn-link text-secondary position-absolute top-50 end-0 translate-middle-y pe-3" type="button" (click)="clearBarcodeStr()" *ngIf="productSearch.barcode" title="Clear" [disabled]="isSearching" style="font-size: 1.2rem;">
                <i class="bi bi-x-circle-fill"></i>
              </button>
            </div>
            <div class="input-group-append">
              <button class="btn btn-primary" type="button" (click)="searchBarcode()" title="Search" [disabled]="isSearching">
                <span *ngIf="!isSearching"><i class="bi bi-search"></i> Search</span>
                <span *ngIf="isSearching"><span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>Searching...</span>
              </button>
            </div>
          </div>
        </div>
        <div class="card-body">
          <div *ngIf="isScanSuccess">
          </div>
          
          <div class="table-responsive">
            <table class="table table-striped table-hover">
              <thead>
                <tr class="table-primary">
                  <th>&nbsp;</th>
                  <th>Part No</th>
                  <th>C Description</th>
                  <th>Brand</th>
                  <th>C Code</th>
                  <th>Application</th>
                  <th>Main Group</th>
                  <th>A Ref</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngIf="hasActiveSearch && resProd.totalRecords === 0 && !isSearching">
                  <td colspan="8" class="text-center text-muted">
                    <i class="bi bi-search"></i> No products found matching your search criteria
                  </td>
                </tr>
                <tr *ngFor="let product of resProd.lists">
                  <td>
                    <a routerLink="/productdetails/{{product.id}}" *ngIf="_mod=='PD'"><i class="bi bi-pencil"></i></a>
                    <a routerLink="/productinquiry/{{product.id}}" *ngIf="_mod=='PI'"><i class="bi bi-zoom-in"></i></a>
                  </td>
                  <td>{{ product.partNo }}</td>
                  <td>{{ product.cDescription }} </td>
                  <td>{{ product.brand }}</td>
                  <td>{{ product.cCode }}</td>
                  <td>{{ product.application }}</td>
                  <td>{{ product.mainGroup }}</td>
                  <td>{{ product.aRef }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <app-pagination
      [pageNum]="resProd.pageNum"
      [pageSize]="10"
      [totalRecords]="resProd.totalRecords"
      (pageChange)="clickPage($event)">
    </app-pagination>
</div>

<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Scanner</h5>
          <button id="modalClose" type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
            <!-- <zxing-scanner [formats]="allowedFormats" (scanSuccess)="onCodeResult($event)"></zxing-scanner> -->
        </div>
        <div class="modal-footer">
        </div>
      </div>
    </div>
  </div>
