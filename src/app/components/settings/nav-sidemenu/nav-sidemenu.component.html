<div id="sidebar-wrapper">
    <ul class="sidebar-nav">
        <li><a routerLink="/">Dashboard</a></li>

        <!-- Accounting Menu (Static) -->
        <li>
            <a class="menu-parent" (click)="toggleModule(-1)">
                <span class="menu-text">Accounting</span>
                <i class="bi" [ngClass]="isModuleExpanded(-1) ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            </a>
            <ul *ngIf="isModuleExpanded(-1)">
                <li>
                    <a routerLink="/bir-posting-slsp" routerLinkActive="active">
                        BIR Posting
                    </a>
                </li>
            </ul>
        </li>

        <!-- Dynamic Menus from API -->
        <li *ngFor="let group of modulesDto; let i = index;">
            <a class="menu-parent" (click)="toggleModule(i)">
                <span class="menu-text">{{ group.Module }}</span>
                <i class="bi" [ngClass]="isModuleExpanded(i) ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            </a>

            <ul *ngIf="isModuleExpanded(i) && group.Menus.length > 0">
            <li *ngFor="let menu of group.Menus;">
                <a [routerLink]="menu.RouterLink" routerLinkActive="active">
                {{ menu.Menu }}
                </a>
            </li>
            </ul>
        </li>
        
        <!-- Sidebar Footer Container -->
        <div class="sidebar-footer-container">
            <!-- User Section -->
            <li class="sidebar-footer">
                <div class="footer-item" (click)="toggleUserMenu()">
                    <i class="bi bi-person-circle"></i>
                    <span>{{ username }}</span>
                </div>
                <div *ngIf="showUserMenu" class="user-menu-panel">
                    <button class="btn-logout" (click)="logout()">
                        <i class="bi bi-box-arrow-right"></i>
                        Logout
                    </button>
                </div>
            </li>
            
            <!-- Database Section -->
            <li class="sidebar-footer">
                <div class="footer-item" (click)="toggleDatabaseMenu()">
                    <i class="bi bi-database"></i>
                    <span>{{ currentDatabase }}</span>
                </div>
                <div *ngIf="showDatabaseMenu" class="database-menu-panel">
                    <div class="panel-header">
                        <span>Switch Database</span>
                        <button class="btn-close-panel" (click)="toggleDatabaseMenu()">×</button>
                    </div>
                    <div class="panel-body">
                        <div class="mb-2">
                            <label class="form-label small">Current:</label>
                            <div class="current-db-badge">{{ currentDatabase }}</div>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small">Switch to:</label>
                            <select
                                class="form-select form-select-sm"
                                [(ngModel)]="selectedDatabase"
                                [disabled]="isLoading">
                                <option *ngFor="let db of databases" [value]="db.DatabaseName">
                                    {{ db.DisplayName }}
                                </option>
                            </select>
                        </div>
                        <div class="d-grid gap-2">
                            <button
                                class="btn btn-primary btn-sm"
                                (click)="switchDatabase()"
                                [disabled]="isLoading || selectedDatabase === currentDatabase">
                                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                                {{ isLoading ? 'Switching...' : 'Switch Database' }}
                            </button>
                            <button class="btn btn-secondary btn-sm" (click)="cancelSwitch()" [disabled]="isLoading">
                                Cancel
                            </button>
                        </div>
                        <div class="text-danger mt-2 small" *ngIf="errorMsg">{{ errorMsg }}</div>
                    </div>
                </div>
            </li>
        </div>
    </ul>
</div>
