<!-- Pagination Footer -->
<div class="d-flex justify-content-between align-items-center"
     *ngIf="totalRecords > 0">
  <div class="text-muted">
    Showing {{ getStartRecord() }} - {{ getEndRecord() }}
    of {{ totalRecords }} Records
  </div>
  <nav>
    <ul class="pagination mb-0">
      <li class="page-item" [class.disabled]="pageNum === 1">
        <a class="page-link" (click)="onPageChange(pageNum - 1); $event.preventDefault()" style="cursor: pointer;">
          <i class="bi bi-chevron-left"></i> Previous
        </a>
      </li>
      <li class="page-item disabled">
        <span class="page-link">Page {{ pageNum }} of {{ getTotalPages() }}</span>
      </li>
      <li class="page-item" [class.disabled]="pageNum === getTotalPages()">
        <a class="page-link" (click)="onPageChange(pageNum + 1); $event.preventDefault()" style="cursor: pointer;">
          Next <i class="bi bi-chevron-right"></i>
        </a>
      </li>
    </ul>
  </nav>
</div>
<div *ngIf="totalRecords === 0" class="text-center">
  <label class="text-muted">No records found</label>
</div>
