<div class="detail-page-background">
  <div class="main-header">
      <h5>
        <a [routerLink]="config.detailRoutePrefix || '/inventory/otheradj'">{{ config.title }}</a>
        <i class="bi bi-chevron-right"></i>
        <span *ngIf="isEditMode">New</span>
        <span *ngIf="!isEditMode">Details</span>
        <span *ngIf="transaction.userPK && !isEditMode"> of {{ transaction.userPK }}</span>
      </h5>
  </div>

  <div class="card">
    <div class="card-body">
    <app-action-menu [toggleSave]="isEditMode" (onSave)="save()" [togglePrint]="false" [toggleEdit]="isEditMode"></app-action-menu>
    <form>
            <!-- Main Information Section - 2 Column Layout -->
            <div class="row g-3 mb-4">
              <!-- Left Column -->
              <div class="col-md-6">
                <div class="row mb-3">
                  <label class="col-sm-4 col-form-label">Account Code</label>
                  <div class="col-sm-8">
                    <input type="text" class="form-control" [(ngModel)]="transaction.accountCode" name="accountCode" 
                           [readonly]="!isEditMode" placeholder="Enter account code">
                  </div>
                </div>
                <div class="row mb-3">
                  <label class="col-sm-4 col-form-label">Account Name</label>
                  <div class="col-sm-8">
                    <input type="text" class="form-control" [(ngModel)]="transaction.accountName" name="accountName" 
                           [readonly]="!isEditMode" placeholder="Enter account name">
                  </div>
                </div>
                <div class="row mb-3">
                  <label class="col-sm-4 col-form-label">Particulars</label>
                  <div class="col-sm-8">
                    <textarea class="form-control" rows="3" [(ngModel)]="transaction.particulars" name="particulars" 
                              [readonly]="!isEditMode" placeholder="Enter particulars"></textarea>
                  </div>
                </div>
              </div>
              
              <!-- Right Column -->
              <div class="col-md-6">
                <div class="row mb-3">
                  <label class="col-sm-4 col-form-label">Date</label>
                  <div class="col-sm-8">
                    <input type="date" class="form-control" 
                           [ngModel]="transaction.dateIssue | date:'yyyy-MM-dd'" 
                           (ngModelChange)="transaction.dateIssue = $event"
                           name="dateIssue" 
                           [readonly]="!isEditMode" required>
                  </div>
                </div>
                <div class="row mb-3">
                  <label class="col-sm-4 col-form-label">Trans No</label>
                  <div class="col-sm-8">
                    <input type="text" class="form-control" [(ngModel)]="transaction.userPK" name="userPK" 
                           [readonly]="!isEditMode" placeholder="Auto-generated if new">
                  </div>
                </div>
                <div class="row mb-3">
                  <label class="col-sm-4 col-form-label">Amount</label>
                  <div class="col-sm-8">
                    <input type="number" step="0.01" class="form-control text-end" 
                           [(ngModel)]="transaction.totalAmount" name="totalAmount" 
                           [readonly]="!isEditMode" placeholder="0.00">
                  </div>
                </div>
              </div>
            </div>

            <!-- Transaction Ledger Items Section -->
            <div class="mb-4" *ngIf="ledgerItems && ledgerItems.length > 0">
              <div class="table-responsive">
                <table class="table table-hover">
                  <thead>
                    <tr class="table-primary">
                      <th style="width: 60px;">Row #</th>
                      <th>Description</th>
                      <th style="width: 120px; text-align: right;">Base Qty In</th>
                      <th style="width: 120px; text-align: right;">Base Qty Out</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let item of ledgerItems; let i = index">
                      <td>{{ i + 1 }}</td>
                      <td>{{ item.displayDescription || '-' }}</td>
                      <td style="text-align: right;">{{ (item.baseUnitQtyIn || 0) | number:'1.2-2' }}</td>
                      <td style="text-align: right;">{{ (item.baseUnitQtyOut || 0) | number:'1.2-2' }}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
            <div class="mb-4" *ngIf="!ledgerItems || ledgerItems.length === 0">
              <div class="ms-auto" style="text-align: center;">
                <label class="text-muted">No transaction details found</label>
              </div>
            </div>
          </form>
        </div>
      </div>
  </div>
